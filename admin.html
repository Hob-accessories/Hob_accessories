<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم</title>
    <style>body{font-family:sans-serif; padding:20px; text-align:center;}</style>
</head>
<body>
    <h2>إضافة منتج جديد (في الرابط الرئيسي)</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="text" id="repo" placeholder="Repo Name">
    <input type="password" id="token" placeholder="GitHub Token">
    <hr>
    <input type="text" id="prodName" placeholder="اسم المنتج">
    <input type="number" id="prodPrice" placeholder="السعر">
    <select id="prodCategory">
        <option value="necklaces">Necklaces</option>
        <option value="hand-chains">Hand Chains</option>
        <option value="rings">Rings</option>
        <option value="sets">Sets</option>
        <option value="bracelet">Bracelets</option>
    </select>
    <br><br>
    <input type="file" id="prodImage">
    <button onclick="startUpload()">رفع المنتج</button>

<script>
async function startUpload() {
    const user = document.getElementById('username').value;
    const repo = document.getElementById('repo').value;
    const token = document.getElementById('token').value;
    const file = document.getElementById('prodImage').files[0];
    
    if(!file) return alert("اختر صورة");

    try {
        // اسم الصورة فقط (بدون مجلد)
        const imgName = Date.now() + "_" + file.name.replace(/\s+/g, '_');
        const base64 = await new Promise(r => { let f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(file); });
        
        // 1. رفع الصورة في الرابط الرئيسي
        const resImg = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${imgName}`, {
            method: 'PUT',
            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: "upload img", content: base64.split(',')[1] })
        });
        
        if(!resImg.ok) throw new Error("فشل رفع الصورة: " + await resImg.text());

        // 2. تحديث JSON
        const getRes = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, { headers: { 'Authorization': `token ${token}` } });
        let sha = "";
        let products = [];

        if(getRes.ok) {
            const data = await getRes.json();
            sha = data.sha;
            products = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        }

        // إضافة المنتج الجديد (الصورة هنا بـ اسم الملف فقط)
        products.push({ id: Date.now(), name: document.getElementById('prodName').value, price: document.getElementById('prodPrice').value, category: document.getElementById('prodCategory').value, image: imgName });

        const resJson = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, {
            method: 'PUT',
            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: "add product", content: btoa(unescape(encodeURIComponent(JSON.stringify(products, null, 2)))), sha: sha ? sha : undefined })
        });

        if(!resJson.ok) throw new Error("فشل تحديث ملف المنتجات: " + await resJson.text());
        
        alert("تمت الإضافة بنجاح!");
    } catch (e) {
        alert("حدث خطأ: " + e.message);
    }
}
</script>
</body>
</html>
